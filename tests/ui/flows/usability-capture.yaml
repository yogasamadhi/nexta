appId: ${APP_ID}
---
- runFlow: connect.yaml
- runFlow:
    file: create-task.yaml
    env:
      TASK_TITLE: 'UI Usability Capture'
      ESTIMATE: '30'
- assertVisible: '排程预览'
- pressKey: Back
- scrollUntilVisible:
    element:
      id: 'capture-new-task'
    timeout: 20000
- takeScreenshot: saved-capture-new-task-action
- tapOn:
    id: 'capture-new-task'
- scrollUntilVisible:
    element:
      text: '添加任务'
    direction: UP
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'capture-title'
    timeout: 15000
- assertVisible:
    id: 'capture-title'
    enabled: true
- tapOn:
    id: 'capture-title'
- inputText: 'UI Usability Next Task'
- takeScreenshot: large-font-capture-keyboard
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'capture-save'
    timeout: 45000
- assertVisible: '保存到 inbox'
- tapOn:
    id: 'capture-save'
    repeat: 2
    delay: 1
- assertVisible:
    id: 'today-inbox'
- tapOn:
    id: 'today-inbox'
- scrollUntilVisible:
    element:
      text: 'UI Usability Next Task'
    timeout: 25000
- assertVisible: 'UI Usability Next Task'
- takeScreenshot: large-font-next-task-inbox
- openLink: ${APP_SCHEME}:///today
