name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum
      - run: pnpm run check

  cloud-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: execution_ci
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: execution_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U execution_ci -d execution_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://execution_ci:ci-local-only@127.0.0.1:5432/execution_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum
      - run: make -C server tools
      - run: pnpm run server:codegen:check
      - run: pnpm run server:test:integration
      - run: pnpm run server:test:sync
